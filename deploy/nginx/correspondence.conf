# /etc/nginx/sites-available/correspondence  (replace mail.example.org)
#
# nginx is the only entry point: TLS, security headers, static SPA, and a
# proxy to Daphne over a Unix socket for /api/ and /ws/.

upstream correspondence_app {
    server unix:/run/correspondence/daphne.sock;
}

# Log the path WITHOUT the query string: WebSocket tickets travel as ?ticket=
# and no URL ever carries content, but there is no reason to keep either.
log_format corr_noargs '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.example.org;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.example.org;

    ssl_certificate     /etc/letsencrypt/live/mail.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:corr_tls:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/correspondence.access.log corr_noargs;
    error_log  /var/log/nginx/correspondence.error.log warn;

    server_tokens off;
    # Encrypted attachments ≤ 25 MB (+ margin); JSON bodies are far smaller.
    client_max_body_size 26m;

    # --- security headers (XSS defence matters: client code sees plaintext) ---
    # 'wasm-unsafe-eval' is required to instantiate the MLS WebAssembly module;
    # no inline scripts, no eval, no third-party origins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://mail.example.org; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    root /opt/correspondence/frontend/dist;

    # Hashed build assets: cache forever. The .wasm needs its MIME type for
    # streaming instantiation (present in Ubuntu's mime.types).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://mail.example.org; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://correspondence_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        # Attachment downloads are already no-store; never cache API responses.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /ws/ {
        proxy_pass http://correspondence_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }

    # SPA: every other path serves index.html (never cached, so updates land).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://mail.example.org; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
